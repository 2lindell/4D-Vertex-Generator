[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "four-d-vertex-generator"
version = "0.2.0"
description = "Enumerate isogonal vertex groups in 4D symmetries"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "2lindell" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
# the Streamlit web app (app.py); the library and the CLI need only numpy and scipy
app = [
  "plotly>=5.20",
  "streamlit>=1.36",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
4d-vertex-generator = "four_d_vertex_generator.cli:main"
4d-off-symmetry = "four_d_vertex_generator.cli:analyze_main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Exploratory research scripts: compact one-liners are kept as written.
"research/**" = ["E501", "E701", "E702", "E731"]
